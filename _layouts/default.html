<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.github.build_revision | default: 'portfolio-v2' }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Kush Bhagat home">kb<span>.</span></a>
        <nav aria-label="Main navigation">
          <a href="{{ '/portfolio' | relative_url }}" {% if page.url contains 'portfolio' %}aria-current="page"{% endif %}>Work</a>
          <a href="{{ '/about' | relative_url }}" {% if page.url contains 'about' %}aria-current="page"{% endif %}>About</a>
          <a href="{{ '/contact' | relative_url }}" {% if page.url contains 'contact' %}aria-current="page"{% endif %}>Contact <span aria-hidden="true" class="arrow">↗︎</span></a>
        </nav>
      </header>
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="site-footer">
        <span>© {{ site.time | date: "%Y" }} Kush Bhagat</span>
        <div><a href="https://github.com/kushb007">GitHub <span class="arrow" aria-hidden="true">↗︎</span></a><a href="https://www.linkedin.com/in/kushbhagat7/">LinkedIn <span class="arrow" aria-hidden="true">↗︎</span></a></div>
      </footer>
    </div>
  </body>
</html>
